# 打包工作流：Windows 桌面版 + Windows CLI。
#
# - 桌面版 exe（WebView2 壳，图标来自仓库内 resource.syso）
# - CLI exe（无窗口，参数方式启动）
# - 打 tag（v*）时额外创建 GitHub Release 并附上产物；其余触发只上传 artifact

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o dist/newapi-box-windows-amd64.exe ./desktop/shell
          go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-windows-cli-amd64.exe .

      # 每次构建都可在 Actions 页面下载
      - uses: actions/upload-artifact@v4
        with:
          name: newapi-box-windows
          path: dist/

      # 打 tag 时发布 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
