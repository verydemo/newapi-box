# 打包工作流：Windows 桌面版 + 各平台 CLI。
#
# - Windows：桌面版 exe（WebView2 壳，图标来自仓库内 resource.syso）+ CLI exe
# - macOS：CLI 二进制（桌面壳依赖 Windows COM，无法跨平台编译）
# - 打 tag（v*）时额外创建 GitHub Release 并附上产物；其余触发只上传 artifact

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Windows：桌面版（GUI）+ 命令行版
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o dist/newapi-box-windows-amd64.exe ./desktop/shell
          go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-windows-cli-amd64.exe .

      # macOS：仅命令行版，双架构
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-darwin-amd64 .

      # 每次构建都可在 Actions 页面下载
      - uses: actions/upload-artifact@v4
        with:
          name: newapi-box-${{ runner.os }}
          path: dist/

      # 打 tag 时发布 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
