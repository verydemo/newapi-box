# 自动发版：push 到 main/master 即构建并发布自增版本号的 Release。
#
# - 版本号自动递增：取已有 v* tag 中最大的，patch +1（v0.0.1 → v0.0.2 → ...）
# - 首次运行从 v0.0.1 开始
# - 产物：Windows 桌面版 exe + CLI exe，附在对应版本的 Release 上
# - 手动触发（workflow_dispatch）同样自增一个版本

name: release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来读取所有 tag

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Determine next version
        id: ver
        shell: bash
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          major=$(echo "$latest" | cut -d. -f1 | tr -d v)
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)
          version="v$major.$minor.$((patch + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: $version (previous: $latest)"

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o dist/newapi-box-windows-amd64.exe ./desktop/shell
          go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-windows-cli-amd64.exe .

      # 精简版：upx 压缩桌面版（约省 60% 体积，个别杀软可能误报）
      - name: Build minified
        shell: bash
        run: |
          choco install upx -y --no-progress
          cp dist/newapi-box-windows-amd64.exe dist/newapi-box-windows-min-amd64.exe
          upx --best --lzma dist/newapi-box-windows-min-amd64.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            自动构建于 main 分支提交 ${{ github.sha }}。

            - `newapi-box-windows-amd64.exe`：桌面版（WebView2 壳）
            - `newapi-box-windows-min-amd64.exe`：桌面版精简版（upx 压缩，个别杀软可能误报）
            - `newapi-box-windows-cli-amd64.exe`：命令行版
          generate_release_notes: true
          files: dist/*
