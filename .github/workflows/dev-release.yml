# 开发版自动发布：push 到 main/master 即构建并更新滚动 Release。
#
# - 产物：Windows 桌面版 exe + CLI exe
# - 发布到 tag `latest`（每次 push 强制移动该 tag，重建 Release）
# - 标记为 prerelease，不占用正式版本号；正式发布仍走 build.yml 的 tag 触发

name: dev-release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o dist/newapi-box-windows-amd64.exe ./desktop/shell
          go build -trimpath -ldflags="-s -w" \
            -o dist/newapi-box-windows-cli-amd64.exe .

      - name: Remove old dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # 首次运行时 latest 不存在，失败属预期，吞掉即可
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "开发版 (latest)"
          body: |
            自动构建于 main 分支最新提交 ${{ github.sha }}。

            - `newapi-box-windows-amd64.exe`：桌面版（WebView2 壳）
            - `newapi-box-windows-cli-amd64.exe`：命令行版
          prerelease: true
          files: dist/*
